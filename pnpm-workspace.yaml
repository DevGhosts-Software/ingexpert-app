packages:
  - 'apps/*'
  - 'packages/*'

catalogs:
  # === FRAMEWORKS & CORE ===
  nest:
    '@nestjs/common': ^11.0.1
    '@nestjs/core': ^11.0.1
    '@nestjs/config': ^4.0.2
    '@nestjs/platform-express': ^11.0.1

  next:
    next: 16.1.1
    react: 19.2.3
    react-dom: 19.2.3

  # === DATABASE & ORM ===
  prisma:
    prisma: ^6.3.1
  prisma-client:
    '@prisma/client': 6.19.2
    '@prisma/adapter-pg': ^7.2.0

  # === TOOLING & BUILD ===
  tooling:
    typescript: ^5.9.3
    turbo: ^2.7.4
    prettier: ^3.7.4
    eslint: ^9.18.0
    '@types/node': ^25.0.7

  # === LINTING & CONFIG ===
  linting:
    '@eslint/eslintrc': ^3.2.0
    '@eslint/js': ^9.18.0
    'eslint-config-prettier': ^10.0.1
    'eslint-plugin-prettier': ^5.2.2
    'eslint-config-next': 16.1.1
    'globals': ^16.0.0
    'typescript-eslint': ^8.20.0

  # === TESTING ===
  testing:
    jest: ^30.0.0
    '@types/jest': ^30.0.0
    '@types/node': ^25.0.7
    ts-jest: ^29.2.5