schema: spec-driven

context: |
  Project: Ingexpert — Desktop-First Corporate Stock Management System (Admin-Only registration)

  Monorepo (pnpm + Turbo):
    - apps/api        → NestJS 11 + tRPC (backend, business logic, Supabase Auth RS256/JWKS)
    - apps/frontend   → Next.js + React 19 + TanStack Query + tRPC client
    - packages/schema → Shared Zod DTOs + Prisma-derived entity types (source of truth for all data shapes)
    - packages/database → Prisma ORM, PostgreSQL

  API contract: openapi/openapi.json (auto-generated by trpc-to-openapi at server startup via GET /openapi.json)
  CRITICAL: Before proposing any new route, data model, or frontend hook, agents MUST read openapi/openapi.json
  to understand existing endpoints, request/response shapes, and authentication requirements.

  Tech stack:
    - TypeScript strict mode (noImplicitAny, no `any`)
    - tRPC v11 for end-to-end type safety
    - Zod v4 for input validation (DTOs only — never wrap API responses in Zod at runtime)
    - Prisma for DB access (write ops only in apps/api)
    - Tailwind CSS v4 + shadcn/ui (Radix UI) for UI
    - Supabase Auth (Admin API for creation, Bearer JWT for validation)

  Naming conventions:
    - Files: kebab-case.ts
    - Classes: PascalCase, Variables/Functions: camelCase
    - Schema DTOs: [Action][Domain]Schema (e.g. CreateItemSchema)
    - Entity types: [Domain]Entity (e.g. ItemEntity)

  Domain inventory: auth, items, kits, movements, projects, users (admin-users sub-router)

  Key architectural rules:
    1. Only apps/api writes to the DB. Frontend consumes exclusively via tRPC.
    2. Zod schemas (DTOs) live in packages/schema — NEVER defined inside routers.
    3. Entity types are Prisma-derived — never define duplicate local interfaces on the frontend.
    4. Stock operations MUST use Prisma transactions.
    5. tRPC infers client types automatically — no manual type annotations needed on the frontend.

  Pre-push pipeline: pnpm check (format → lint → type-check → Next.js build)

rules:
  proposal:
    - Always cross-reference openapi/openapi.json before proposing new endpoints or data models
    - Identify which tRPC router and NestJS service module the feature belongs to
    - State explicitly whether new Prisma schema changes are required
  tasks:
    - Each task must reference the specific file(s) to be created or modified
    - Include a pnpm check step at the end of every implementation task list
    - Separate schema package changes from API and frontend changes (they must be built in order)
