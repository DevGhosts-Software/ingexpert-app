name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Setup Database Environment
        run: |
          echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" > packages/database/.env
          echo "DIRECT_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" >> packages/database/.env

      - name: Setup Frontend Environment
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > apps/frontend/.env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> apps/frontend/.env
          echo "NEXT_PUBLIC_SUPABASE_ADMIN_CONTROL_FUNCTION=admin-control" >> apps/frontend/.env
          echo "NEXT_PUBLIC_POWERSYNC_URL=${{ secrets.NEXT_PUBLIC_POWERSYNC_URL }}" >> apps/frontend/.env
          echo "NEXT_PUBLIC_POWERSYNC_TOKEN=${{ secrets.NEXT_PUBLIC_POWERSYNC_TOKEN }}" >> apps/frontend/.env
          echo "PORT=3000" >> apps/frontend/.env
          pnpm turbo run build --filter=@ingexpert/schema --filter=@ingexpert/database --filter=@ingexpert/config

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/frontend
          tauriScript: pnpm run
          tagName: v__VERSION__
          releaseName: "Ingexpert v__VERSION__"
          releaseBody: "Automated release triggered from main branch."
          releaseDraft: false
          prerelease: false

      - name: Upload to Supabase Storage
        run: |
          # Extract version from GITHUB_REF (e.g., refs/tags/v0.1.3 -> 0.1.3)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev"
          fi

          PLATFORM=${{ matrix.platform }}
          PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          STORAGE_URL="https://${PROJECT_REF}.supabase.co/storage/v1/object"

          # Determine OS identifier
          if [ "$PLATFORM" == "ubuntu-24.04" ]; then
            OS_ARCH="linux-x64"
          else
            OS_ARCH="windows-x64"
          fi

          echo "Uploading v${VERSION} for ${OS_ARCH} to Supabase Storage"

          # Enable nullglob so globs that don't match expand to nothing
          shopt -s nullglob

          # URL-encode spaces in path
          uriencode() {
            echo "$1" | sed 's/ /%20/g'
          }

          upload_file() {
            path="$1"
            file="$2"
            encoded_path=$(uriencode "releases/${path}")

            echo "STORAGE_URL: ${STORAGE_URL}"
            echo "Uploading file: $file"
            echo "Path: ${encoded_path}"

            response=$(curl -s -w "\n%{http_code}" -X POST "${STORAGE_URL}/${encoded_path}" \
              -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            echo "HTTP ${http_code}: $body"
            if [ "$http_code" -ge 400 ]; then
              echo "Upload failed for $file"
              exit 1
            fi
            echo "Uploaded $(basename "$file")"
          }

          # Upload artifacts from the bundle directory
          BUNDLE_DIR="apps/frontend/src-tauri/target/release/bundle"

          # Find and upload AppImage
          for f in "${BUNDLE_DIR}/appimage"/*.AppImage; do
            upload_file "v${VERSION}/${OS_ARCH}/$(basename "$f")" "$f"
          done

          # Find and upload deb (skip .sig files)
          for f in "${BUNDLE_DIR}/deb"/*.deb; do
            [[ "$f" != *.sig ]] && upload_file "v${VERSION}/${OS_ARCH}/$(basename "$f")" "$f"
          done

          # Find and upload msi
          for f in "${BUNDLE_DIR}/msi"/*.msi; do
            upload_file "v${VERSION}/${OS_ARCH}/$(basename "$f")" "$f"
          done

          # Find and upload nsis
          for f in "${BUNDLE_DIR}/nsis"/*.exe; do
            upload_file "v${VERSION}/${OS_ARCH}/$(basename "$f")" "$f"
          done

      - name: Generate and upload latest.json
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev"
          fi
          DATE=$(date -u +%Y-%m-%d)
          PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          STORAGE_URL="https://${PROJECT_REF}.supabase.co/storage/v1/object"

          # Collect actual filenames dynamically
          BUNDLE_DIR="apps/frontend/src-tauri/target/release/bundle"
          shopt -s nullglob

          APPIMAGE=$(basename "${BUNDLE_DIR}/appimage"/IngExpert*.AppImage 2>/dev/null | head -1)
          DEB=$(basename "${BUNDLE_DIR}/deb"/IngExpert*.deb 2>/dev/null | grep -v '.sig$' | head -1)
          MSI=$(basename "${BUNDLE_DIR}/msi"/*.msi 2>/dev/null | head -1)
          NSIS=$(basename "${BUNDLE_DIR}/nsis"/*.exe 2>/dev/null | head -1)

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "date": "${DATE}",
            "files": {
              "linux-x64": {
                "appimage": "${APPIMAGE}",
                "deb": "${DEB}"
              },
              "windows-x64": {
                "msi": "${MSI}",
                "nsis": "${NSIS}"
              }
            }
          }
          EOF

          echo "Uploading latest.json:"
          cat latest.json
          curl -s -X POST "${STORAGE_URL}/releases/latest.json" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json > /dev/null
          echo "Uploaded latest.json"
