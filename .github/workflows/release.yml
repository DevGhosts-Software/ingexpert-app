name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write 

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Setup Database Environment
        run: |
          echo "DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" > packages/database/.env
          echo "DIRECT_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder" >> packages/database/.env

      - name: Setup Frontend Environment
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" > apps/frontend/.env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> apps/frontend/.env
          echo "NEXT_PUBLIC_SUPABASE_ADMIN_CONTROL_FUNCTION=admin-control" >> apps/frontend/.env
          echo "NEXT_PUBLIC_POWERSYNC_URL=${{ secrets.NEXT_PUBLIC_POWERSYNC_URL }}" >> apps/frontend/.env
          echo "NEXT_PUBLIC_POWERSYNC_TOKEN=${{ secrets.NEXT_PUBLIC_POWERSYNC_TOKEN }}" >> apps/frontend/.env
          echo "PORT=3000" >> apps/frontend/.env
          pnpm turbo run build --filter=@ingexpert/schema --filter=@ingexpert/database --filter=@ingexpert/config

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/frontend
          tauriScript: pnpm run
          tagName: v__VERSION__
          releaseName: "Ingexpert v__VERSION__"
          releaseBody: "Automated release triggered from main branch."
          releaseDraft: false
          prerelease: false

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Upload to Supabase Storage
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          PLATFORM=${{ matrix.platform }}

          # Determine OS identifier
          if [ "$PLATFORM" == "ubuntu-24.04" ]; then
            OS_ARCH="linux-x64"
          else
            OS_ARCH="windows-x64"
          fi

          echo "Uploading v${VERSION} for ${OS_ARCH} to Supabase Storage"

          # Login to Supabase
          supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

          # Link project
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

          # Upload artifacts from the bundle directory
          BUNDLE_DIR="apps/frontend/src-tauri/target/release/bundle"

          # Find and upload AppImage
          if [ -d "${BUNDLE_DIR}/appimage" ]; then
            for f in "${BUNDLE_DIR}/appimage"/*.AppImage; do
              if [ -f "$f" ]; then
                supabase storage upload "releases/v${VERSION}/${OS_ARCH}/$(basename $f)" "$f"
                echo "Uploaded $(basename $f)"
              fi
            done
          fi

          # Find and upload deb
          if [ -d "${BUNDLE_DIR}/deb" ]; then
            for f in "${BUNDLE_DIR}/deb"/*.deb; do
              if [ -f "$f" ]; then
                supabase storage upload "releases/v${VERSION}/${OS_ARCH}/$(basename $f)" "$f"
                echo "Uploaded $(basename $f)"
              fi
            done
          fi

          # Find and upload msi
          if [ -d "${BUNDLE_DIR}/msi" ]; then
            for f in "${BUNDLE_DIR}/msi"/*.msi; do
              if [ -f "$f" ]; then
                supabase storage upload "releases/v${VERSION}/${OS_ARCH}/$(basename $f)" "$f"
                echo "Uploaded $(basename $f)"
              fi
            done
          fi

          # Find and upload nsis
          if [ -d "${BUNDLE_DIR}/nsis" ]; then
            for f in "${BUNDLE_DIR}/nsis"/*.exe; do
              if [ -f "$f" ]; then
                supabase storage upload "releases/v${VERSION}/${OS_ARCH}/$(basename $f)" "$f"
                echo "Uploaded $(basename $f)"
              fi
            done
          fi

      - name: Generate and upload latest.json
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          DATE=$(date -u +%Y-%m-%d)

          # Login to Supabase (only needed once, but re-linking is fast)
          supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

          # Download existing latest.json if it exists to get file info
          # Then create a new manifest that references this version
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "date": "${DATE}",
            "files": {
              "linux-x64": {
                "appimage": "IngExpert.AppImage",
                "deb": "ingexpert_${VERSION}_amd64.deb"
              },
              "windows-x64": {
                "msi": "IngExpert_${VERSION}_x64.msi",
                "nsis": "IngExpert_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          supabase storage upload "releases/latest.json" latest.json
          echo "Uploaded latest.json"
