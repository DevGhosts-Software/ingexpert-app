port: ${PS_PORT}

database:
  type: postgresql
  uri: ${PS_DATA_SOURCE_URI}
  publication: powersync

mongo:
  uri: ${PS_MONGO_URI}

sync_rules:
  content: |
    bucket_definitions:
      global:
        # Baseline policy: sync all rows to all authenticated users.
        data:
          - SELECT id, code, name, location, stock, unit, type, image_url FROM items
          - SELECT id, type, created_by_id, destination, observations, responsible_delivery_id, responsible_receipt_id, date, project_id FROM movements
          - SELECT id, movement_id, item_id, quantity FROM movement_details
          - SELECT id, name, contact, address, manager_id FROM projects

schema:
  Item:
    id: text
    code: text
    name: text
    location: text
    stock: real
    unit: text
    type: text
    image_url: text
  Movement:
    id: text
    type: text
    created_by_id: text
    destination: text
    observations: text
    responsible_delivery_id: text
    responsible_receipt_id: text
    date: text
    project_id: text
  MovementDetail:
    id: text
    movement_id: text
    item_id: text
    quantity: real
  Project:
    id: text
    name: text
    contact: text
    address: text
    manager_id: text
